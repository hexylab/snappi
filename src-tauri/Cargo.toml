[package]
name = "snappi"
version = "0.2.0"
description = "Screen Studio-level screen recorder for Windows"
authors = ["hexylab"]
edition = "2021"
# 評価用の snappi-eval もあるので、cargo run の既定バイナリを明示する
default-run = "snappi"

[lib]
name = "snappi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
# 保存先フォルダの選択
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = "0.25"
# プレビュー用のカーソル画像を data URL で渡す
base64 = "0.22"

# Audio capture
cpal = "0.15"

# Windows APIs (Screen capture via Desktop Duplication, UI Automation, etc.)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_Accessibility",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_Threading",
] }

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.anyhow]
version = "1"

[dependencies.log]
version = "0.4"

[dependencies.env_logger]
version = "0.11"

[dependencies.tempfile]
version = "3"

[dependencies.dirs]
version = "6"

[dependencies.rayon]
version = "1"

# TypeScript 型の自動生成。
# cargo test --features ts-export --lib で、型アノテーション付きの構造体から
# src/lib/generated/ に TypeScript の定義を生成する。通常ビルドには含まれない。
[dependencies.ts-rs]
version = "10"
optional = true

[features]
ts-export = ["ts-rs"]

# 開発ビルド（npm run tauri dev）でも録画のフレームレートを保つため、依存クレート（JPEG エンコーダ等）は
# 最適化してビルドし、自分のクレートも軽く最適化する（JPEG エンコーダはジェネリックなので
# 呼び出し側のクレートでコンパイルされる）
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
